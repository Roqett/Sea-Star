name: SeaStar
options:
  bundleIdPrefix: UpPeriscope
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SeaStar:
    type: application
    platform: macOS
    sources:
      - path: SeaStar
        excludes:
          - "Support/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: UpPeriscope.Sea-Star
        PRODUCT_NAME: Sea-Star
        PRODUCT_MODULE_NAME: SeaStar
      # Two configurations, because building for yourself and building for
      # strangers are different acts and were previously the same one.
      configs:
        Debug:
          # Local development: ad-hoc signed and unsigned, so anyone can build
          # and run it without an Apple account. Never ship this configuration.
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          # Shipping: notarisation *requires* the hardened runtime, and a
          # hardened runtime is meaningless without a real signature. The
          # identity is fixed and the team is supplied by `script/release.sh`,
          # so no account identifier is committed to the repository.
          #
          # This configuration fails the build when no Developer ID certificate
          # is present, which is deliberate: a Release build that silently falls
          # back to ad-hoc would produce a DMG that Gatekeeper refuses on someone
          # else's Mac, and the failure would arrive as a support message instead
          # of a build error.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
    info:
      path: SeaStar/Support/Info.plist
      properties:
        CFBundleName: Sea-Star
        CFBundleDisplayName: Sea-Star
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        SeaStarRepositoryPath: "$(SRCROOT)/.."
        NSHumanReadableCopyright: "MIT. Up Periscope."

  SeaStarTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SeaStarTests]
    dependencies:
      - target: SeaStar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: UpPeriscope.Sea-StarTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sea-Star.app/Contents/MacOS/Sea-Star"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SeaStar:
    build:
      targets:
        SeaStar: all
        SeaStarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SeaStarTests]
